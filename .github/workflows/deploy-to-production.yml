# ****************************************************************************
# Production deployment of the DATA.
#
# Trigger: push to the "master" branch (or run manually from the Actions tab).
# Builds the data and publishes it to the separate production organisation:
#   https://github.com/cbs-curacao-sdg/sdg-data  (branch gh-pages)
#   -> https://cbs-curacao-sdg.github.io/sdg-data/
# Then waits 11 minutes for GitHub Pages to publish the data, and triggers the
# production SITE rebuild (cbs-curacao/sdg-site, deploy-to-production.yml on master).
#
# Secrets used (in this repo, Settings > Secrets and variables > Actions):
#   PROD_TOKEN - fine-grained token, owner cbs-curacao-sdg, Contents: read/write
#   TOKEN      - token that may start workflows in cbs-curacao/sdg-site
#                (same one the staging workflow uses)
# ****************************************************************************

name: Deploy to production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
    - name: Build data
      run: |
        python scripts/build_data.py
    - name: Place public files
      run: |
        cp public/robots-prod.txt _site/robots.txt
        touch _site/.nojekyll
    - name: Deploy to GitHub Pages (production organisation)
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        repository-name: cbs-curacao-sdg/sdg-data
        token: ${{ secrets.PROD_TOKEN }}
        branch: gh-pages
        folder: _site
        clean: true
    - name: Waiting 11 minutes for production data deployment
      run: |
        sleep 660
    - name: Rebuild site
      run: |
        curl --fail-with-body -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.token }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/cbs-curacao/sdg-site/actions/workflows/deploy-to-production.yml/dispatches \
          -d '{"ref":"master"}'
