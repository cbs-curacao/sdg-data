indicator_name: Proportion of adults (15 years and older) with an account at a bank or other financial institution or with a mobile-money-service provider
indicator_number: 8.10.2
computation_units: Percentage
source_active_1: true
source_organisation_1: Central Bureau of Statistics (CBS) Curaçao
source_url_1: "https://www.cbs.cw/"
reporting_status: complete
graph_type: bar

# --- Additions for the demo ---
#
# Internal links below use the hardcoded `/sdg-site/` baseurl prefix because
# Open SDG renders these fields without applying Jekyll's `relative_url`
# filter, so a plain `/foo/` path 404s under a project-page deployment.
# When promoting to a production site with a different (or empty) baseurl,
# search-and-replace `/sdg-site/` accordingly — or move to a templated include.

# Brief context that displays above the chart on the indicator page.
page_content: >
  This indicator measures the proportion of residents aged 15 and older who
  hold an account at a regulated financial institution or who have personally
  used a mobile-money-service provider in the previous twelve months.
  For the national policy and legislative context, see the
  [Policies and references page for Goal 8](/sdg-site/policies/goal-8/).

# Short note below the chart, linking to the methodology PDF.
data_footnote: >
  For the calculation method, sample frame, and known limitations, see the
  [national methodology note](/sdg-site/assets/pdfs/policies/goal-8/8-10-2-methodology-note.pdf).

