POLICIES: |
  This indicator is relevant to national policy on financial inclusion, access to banking services, digital payments, and inclusive economic participation.

  Relevant policy areas include:

  - access to formal financial services;
  - financial inclusion for households and individuals;
  - digital transformation of payment systems;
  - access to banking services for vulnerable groups.

  Related institutions may include the [Central Bank of Curaçao and Sint Maarten](https://www.centralbank.cw/) and national ministries responsible for economic development and social policy.
