indicator_number: 16.2.2
indicator_name: Number of victims of human trafficking per 100,000 population, by sex, age and form of exploitation
reporting_status: complete
data_non_statistical: false
national_indicator_available: Detected victims of human trafficking, Curaçao
graph_type: bar
graph_title: Detected victims of human trafficking, Curaçao
data_show_map: false
computation_units: Number of detected victims; victims per 100,000 population
data_footnote: >-
  Figures are small and year-to-year changes largely reflect detection and
  investigative capacity, which increased after PATH was established in March 2024.
  All registered victims in 2020 to 2025 were women. Age is not available for 2023
  and 2024; PATH has registered no victims under 18 in this period. Form of
  exploitation for 2021 to 2024 is derived from the type of case registered in each
  year, as each year had a single case type.
